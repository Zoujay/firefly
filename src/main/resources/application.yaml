spring:
  application:
    name: firefly

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/firefly}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      pool-name: FireflyHikariPool
      minimum-idle: 2
      maximum-pool-size: 30
      connection-timeout: 30000
      validation-timeout: 3000
      idle-timeout: 300000
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: false
    database: MYSQL

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    producer:
      batch-size: 16384
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # Reduce duplicate writes during a single producer session. The durable
        # Outbox and consumer Inbox still provide recovery across process crashes.
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5

    listener:
      ack-mode: manual_immediate
      type: batch
      concurrency: 1

    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 200
      group-id: firefly
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        max.poll.interval.ms: 600000

server:
  port: ${SERVER_PORT:9999}

firefly:
  kafka:
    processing:
      # Per-instance business concurrency. Keep headroom below the 30-connection
      # Hikari maximum for Outbox publication, admin recovery, and HTTP requests.
      max-concurrency: ${KAFKA_MESSAGE_MAX_CONCURRENCY:24}
