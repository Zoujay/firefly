spring:
  application:
    name: firefly

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/firefly}
    type: com.alibaba.druid.pool.DruidDataSource
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

    druid:
      initial-size: 2
      max-active: 30
      min-idle: 2
      max-wait: 30000
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 5
      validation-query: SELECT 1
      validation-query-timeout: 3
      test-on-borrow: false
      test-on-return: false
      test-while-idle: true
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      async-close-connection-enable: true
      aop-patterns: firefly.service.*

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: false
    database: MYSQL

  data:
    redis:
      repositories:
        enabled: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    producer:
      batch-size: 16384
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # Reduce duplicate writes during a single producer session. The durable
        # Outbox and consumer Inbox still provide recovery across process crashes.
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5

    listener:
      ack-mode: manual_immediate
      type: batch
      concurrency: 1

    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 200
      group-id: firefly
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        max.poll.interval.ms: 600000

server:
  port: ${SERVER_PORT:9999}
