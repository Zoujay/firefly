spring:
  application:
    name: firefly

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/firefly}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      pool-name: FireflyHikariPool
      minimum-idle: 2
      maximum-pool-size: 30
      connection-timeout: 30000
      validation-timeout: 3000
      idle-timeout: 300000
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: false
    database: MYSQL

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    producer:
      batch-size: 16384
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # Reduce duplicate writes during a single producer session. The durable
        # Outbox and consumer Inbox still provide recovery across process crashes.
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5

    listener:
      ack-mode: manual_immediate
      type: batch
      concurrency: 1

    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 200
      group-id: firefly
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        max.poll.interval.ms: 600000

server:
  port: ${SERVER_PORT:9999}

firefly:
  github:
    client-id: ${GITHUB_CLIENT_ID:}
    client-secret: ${GITHUB_CLIENT_SECRET:}
    redirect-uri: ${GITHUB_REDIRECT_URI:}
    webhook-callback-url: ${GITHUB_WEBHOOK_CALLBACK_URL:}
    oauth-base-url: ${GITHUB_OAUTH_BASE_URL:https://github.com}
    api-base-url: ${GITHUB_API_BASE_URL:https://api.github.com}
    api-version: ${GITHUB_API_VERSION:2026-03-10}
    user-agent: ${GITHUB_USER_AGENT:firefly}
    scopes: ${GITHUB_SCOPES:admin:repo_hook}
    state-ttl: ${GITHUB_OAUTH_STATE_TTL:10m}
    storage:
      encryption-key: ${GITHUB_ENCRYPTION_KEY:}
      key-version: ${GITHUB_ENCRYPTION_KEY_VERSION:v1}
    processing:
      lease-timeout: ${GITHUB_PROCESSING_LEASE_TIMEOUT:5m}
      retry-delay: ${GITHUB_PROCESSING_RETRY_DELAY:30s}
      max-attempts: ${GITHUB_PROCESSING_MAX_ATTEMPTS:5}
      recovery-interval: ${GITHUB_PROCESSING_RECOVERY_INTERVAL:60s}
